[package]
name = "mock-orao-vrf"
version = "0.1.0"
edition = "2021"
description = "Local-validator stand-in for ORAO VRF v2. Test harness only, never deployed."

[lib]
crate-type = ["cdylib", "lib"]
name = "mock_orao_vrf"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "1.2.0"

# Its own workspace root on purpose: this crate must not perturb the audited
# program's workspace, lockfile, or release profile in any way.
[workspace]
